<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Consulta de Programación</title>
  <style>
    * { box-sizing: border-box; font-family: system-ui, -apple-system, sans-serif; }
    body { background-color: #f8fafc; color: #1e293b; margin: 0; padding: 20px; display: flex; justify-content: center; min-height: 100vh; }
    .card { background: #ffffff; border-radius: 12px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); padding: 24px; max-width: 480px; width: 100%; height: fit-content; margin-top: 20px; }
    h2 { margin-top: 0; color: #0f172a; font-size: 1.25rem; text-align: center; }
    label { font-size: 0.875rem; font-weight: 500; color: #475569; display: block; margin-bottom: 8px; }
    input[type="text"] { width: 100%; padding: 12px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 1rem; outline: none; }
    input[type="text"]:focus { border-color: #2563eb; }
    .result-box { margin-top: 20px; padding: 16px; border-radius: 8px; background-color: #f1f5f9; border-left: 4px solid #2563eb; display: none; }
    .result-title { font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.05em; color: #64748b; margin-bottom: 4px; }
    .result-value { font-size: 1.125rem; font-weight: 600; color: #0f172a; }
    .not-found { color: #dc2626; border-left-color: #dc2626; background-color: #fef2f2; }
  </style>
</head>
<body>
  <div class="card">
    <h2>Consulta de Programación</h2>
    <label for="searchInput">Ingresa el código o dato a consultar:</label>
    <input type="text" id="searchInput" placeholder="Ej: A-101..." oninput="buscarDato()">
    
    <div id="result" class="result-box">
      <div class="result-title">Resultado / Programación:</div>
      <div id="resultText" class="result-value"></div>
    </div>
  </div>

  <script>
    let dataset = [];

    fetch('data.json')
      .then(response => response.json())
      .then(data => { dataset = data; })
      .catch(err => console.error('Error al cargar data.json:', err));

    function buscarDato() {
      const query = document.getElementById('searchInput').value.trim().toLowerCase();
      const resultBox = document.getElementById('result');
      const resultText = document.getElementById('resultText');

      if (query === '') {
        resultBox.style.display = 'none';
        return;
      }

      const item = dataset.find(row => row.codigo && row.codigo.toString().toLowerCase() === query);

      if (item) {
        resultText.textContent = item.programacion;
        resultBox.className = 'result-box';
        resultBox.style.display = 'block';
      } else {
        resultText.textContent = 'No se encontró información para este código.';
        resultBox.className = 'result-box not-found';
        resultBox.style.display = 'block';
      }
    }
  </script>
</body>
</html>
